<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#06111f" />
<title>Mapa Estratégico de Proyectos</title>
<style>
html,body{height:100%;margin:0;background:radial-gradient(circle at 25% 0%,rgba(56,189,248,.16),transparent 30%),linear-gradient(135deg,#050c17,#07111f 55%,#0a1024);color:#eef6ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}main{max-width:720px;padding:28px;text-align:center}h1{font-size:clamp(32px,6vw,56px);line-height:.98;margin:0 0 14px}p{color:#aab8ca;line-height:1.55}.loader{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;border:3px solid rgba(56,189,248,.18);border-top-color:#38bdf8;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{color:#38bdf8}
</style>
</head>
<body>
<main>
  <div class="loader"></div>
  <h1>Mapa Estratégico de Proyectos</h1>
  <p>Cargando la cabina visual principal.</p>
  <p id="fallback"></p>
</main>
<script>
const raw='https://raw.githubusercontent.com/Anfaliz1703/Mapa-Estrategico-de-Proyectos/main/index.html?ts='+Date.now();
fetch(raw,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar');return r.text()}).then(html=>{document.open();document.write(html);document.close();}).catch(()=>{document.getElementById('fallback').innerHTML='No se pudo cargar automáticamente. Abre el archivo principal desde <a href="https://github.com/Anfaliz1703/Mapa-Estrategico-de-Proyectos/blob/main/index.html">GitHub</a>.'});
</script>
</body>
</html>
